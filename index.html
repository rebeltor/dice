<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D100 Dice Roller</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="container">
        <h1>D100 Dice Roller</h1>

        <!-- die display and roll button -->
        <div class="card die-card">
            <div id="die" class="die">?</div>
            <button id="rollBtn">Roll D100</button>
        </div>

        <!-- running statistics -->
        <div class="card stats-card">
            <div class="stat">
                <span class="stat-label">Average</span>
                <span id="average" class="stat-value">—</span>
            </div>
            <div class="stat">
                <span class="stat-label">Total Rolls</span>
                <span id="count" class="stat-value">0</span>
            </div>
        </div>

        <!-- roll history -->
        <div class="card history-card">
            <div class="history-header">
                <h2>History</h2>
                <button id="clearBtn" class="clear-btn">Clear</button>
            </div>
            <div id="history" class="history-list">
                <p class="no-history">No rolls yet</p>
            </div>
        </div>
    </div>

    <script src="dice.js"></script>
</body>
</html>
