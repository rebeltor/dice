<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D100 Dice Roller</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="container">
        <h1>D100 Dice Roller</h1>

        <div class="card die-card">
            <div id="die" class="die">?</div>
            <button id="rollBtn">Roll D100</button>
        </div>

        <div class="card stats-card">
            <div class="stat">
                <span class="stat-label">Average</span>
                <span id="stat-avg" class="stat-value">—</span>
            </div>
            <div class="stat">
                <span class="stat-label">Rolls</span>
                <span id="stat-count" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Best</span>
                <span id="stat-max" class="stat-value stat-best">—</span>
            </div>
            <div class="stat">
                <span class="stat-label">Worst</span>
                <span id="stat-min" class="stat-value stat-worst">—</span>
            </div>
        </div>

        <div class="card history-card">
            <div class="history-header">
                <h2>History <span class="history-sub">(last 20)</span></h2>
                <button id="clearBtn" class="clear-btn">Clear</button>
            </div>
            <div id="history" class="history-list">
                <p class="no-history">No rolls yet</p>
            </div>
            <div class="legend">
                <span class="legend-item roll-critical">96–100 Critical</span>
                <span class="legend-item roll-decent">65–95 Decent</span>
                <span class="legend-item roll-lame">6–64 Lame</span>
                <span class="legend-item roll-fumble">1–5 Fumble</span>
            </div>
        </div>
    </div>

    <script src="dice.js"></script>
</body>
</html>
